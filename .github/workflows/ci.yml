name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality_linux:
    name: quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Format shared filesystem codec
        run: cargo fmt --manifest-path crates/filesystem-rpc/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy shared filesystem codec
        run: cargo clippy --locked --manifest-path crates/filesystem-rpc/Cargo.toml --all-targets -- -D warnings

  runtime_matrix:
    name: runtime (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Test shared filesystem codec
        run: cargo test --locked --manifest-path crates/filesystem-rpc/Cargo.toml

      - name: Build (release)
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: cargo build --locked --release
